# Auto-add new issues to the org backlog (Project 1). td-meta#52.
# Canonical copy: tuxedodrive/.github/workflow-templates/add-to-backlog.yml
# Self-contained on purpose — cross-repo reusable calls from the private
# .github repo fail resolution on this plan. Do not edit in place; re-roll
# from canonical. tools/shepherd-autoadd-scan.sh flags drift.
name: add-to-backlog

on:
  issues:
    types: [opened]

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/orgs/tuxedodrive/projects/1
          github-token: ${{ secrets.ADD_TO_BACKLOG_PAT }}
